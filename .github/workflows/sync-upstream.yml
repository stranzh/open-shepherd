name: Sync Upstream (DataDog/IDE-SHEPHERD-extension)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/DataDog/IDE-SHEPHERD-extension.git || true
          git fetch upstream main

      - name: Create PR if upstream has new commits
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          BRANCH="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git merge --no-edit upstream/main || true
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync upstream DataDog/IDE-SHEPHERD-extension" \
            --body "Automated sync with \`DataDog/IDE-SHEPHERD-extension\` ($BEHIND new commits)." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
